[project]
name = "project-name"
version = "0.0.1"
description = "short caption"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anaplan-sdk[cert]>=0.5.2",
    "fastapi>=0.115.8",
    "polars>=1.22.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "basedpyright>=1.33.0",
]

[tool.pyright]
typeCheckingMode = "strict"
reportUnusedCallResult = false
reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 100
fix = true
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
skip-magic-trailing-comma = true
