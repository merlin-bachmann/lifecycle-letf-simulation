name: 'Build and Deploy to Cloud Run'

on:
  # TODO: Uncomment to run deployments
  # push:
  #   branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      id-token: write

    env:
      DOCKER_IMAGE: europe-west3-docker.pkg.dev/anaplan-apps/images/${{github.event.repository.name}}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: GCP Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Docker Auth
        uses: docker/login-action@v3.3.0
        with:
          registry: europe-west3-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{env.DOCKER_IMAGE}}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{github.event.repository.name}}
          image: ${{env.DOCKER_IMAGE}}
          region: 'europe-west1' # https://cloud.google.com/run/docs/mapping-custom-domains#limitations
          # TODO: Add your env vars here
          env_vars: |
            ABC="${{secrets.ABC}}"
